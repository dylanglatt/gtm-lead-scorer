# One-click deploy on Render: New → Blueprint → point it at this repo.
#
# startCommand is the Procfile line, byte for byte. Three places say it because Render reads
# this file, a Procfile host reads the other, and a container host reads the Dockerfile CMD;
# they must not drift, so if one changes the others change with it.
#
# --workers 1 is deliberate, not a resource decision: _RESULTS in app.py is per-process
# state holding ranked boards between the POST and the redirected GET. A second worker
# means a redirect can land on a process that never saw the token, and the upload fails
# with "no longer available" about half the time. Raise --threads, never --workers,
# unless _RESULTS moves out of process memory first.
#
# PYTHON_VERSION is pinned because model.joblib is a pickle: scikit-learn is pinned exactly
# in requirements.txt for the same reason, and pinning the interpreter alongside it keeps
# the load path identical on every build rather than whatever Render's default happens to
# be that month.
services:
  - type: web
    name: gtm-lead-scorer
    runtime: python
    # Paid tier on purpose: free spins down after ~15 minutes idle and answers the
    # next click with a 30-50 second cold start. The link is being sent to people
    # who will open it once. Dropping to free is a behavior change, not a cleanup.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    # The route exists for exactly this: a health check that never touches the model.
    # NOT /health, which is the run-history page and reads a disk. A liveness probe that
    # touched storage would take the site down for a reason the site can survive.
    healthCheckPath: /healthz
    # Run history. Render's filesystem is ephemeral, so a SQLite file anywhere else is
    # wiped on every deploy -- which would make the page most useful across months of runs
    # the one page that cannot see past the last push. A disk is the whole fix.
    #
    # A disk pins the service to ONE instance, which is not a new constraint: --workers 1
    # above already says this process is singular, for _RESULTS' sake. The same sentence
    # applies here -- if run history ever needs to outlive a single instance, it moves to
    # a managed Postgres and this block goes away, rather than the disk being scaled.
    #
    # 1GB is enormous for the job. A run is under 200 bytes and this writes one per
    # upload; the smallest disk Render sells is already several human lifetimes of demo.
    disk:
      name: run-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Unset is a fully supported state -- no store, no writes, and /health says it has
      # no data (see runs.py). It is set here because on THIS host there is a disk to put
      # it on; a local checkout with nothing set runs and tests exactly the same.
      - key: RUN_HISTORY_DB
        value: /var/data/runs.db
      # sync: false -- Render will prompt for these in the dashboard instead of reading a
      # value out of this file, so a Salesforce Consumer Secret never sits in git. All
      # three unset (the default until someone fills them in) is a supported state: the
      # app just runs without the Salesforce feature -- see sf_configured in app.py.
      - key: SF_LOGIN_URL
        sync: false
      - key: SF_CONSUMER_KEY
        sync: false
      - key: SF_CONSUMER_SECRET
        sync: false
